<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mohamed Amine Nafia is a Frontend Developer specializing in building modern, responsive, and user-friendly web experiences with HTML, CSS, JavaScript, and React."
    />
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body
    class="w-full h-screen font-Manrope bg-primary dark:bg-slate-950 duration-300 ease-linear"
  >
    <div class="w-full h-dvh mx-auto px-3.5">
      <section>
        <div
          class="bg-indigo-100 dark:bg-indigo-950 absolute left-0 top-32 w-32 h-32 md:w-54 md:h-54 rounded-full blur-3xl -z-10"
        ></div>
        <div
          class="absolute bg-violet-100 dark:bg-violet-950 w-32 h-32 md:w-54 md:h-54 rounded-full right-0 top-72 blur-3xl -z-10"
        ></div>
        <div
          class="absolute bg-slate-100 dark:bg-slate-700 w-32 h-32 md:w-54 md:h-54 rounded-full left-1/3 bottom-12 blur-3xl -z-10"
        ></div>
        <header
          role="banner"
          class="flex items-center sticky top-0 justify-between md:justify-center py-3.5 md:max-w-240 md:mx-auto md:px-3.5"
        >
          <!--LOGO-->
          <div class="flex items-center gap-2 md:flex-1 md:whitespace-nowrap">
            <img class="w-12" src="./images/logo_2.webp" alt="logo" />
            <span class="text-sm text-grey font-medium dark:text-primary"
              >Available for work</span
            >
            <span
              class="h-2 w-2 rounded-full inline-block bg-green-500 animate-pulse"
            ></span>
          </div>
          <!--MOBILE MENU-->
          <img
            id="menu"
            class="w-9 md:hidden cursor-pointer dark:invert-100"
            src="./images/menu.svg"
            alt="menu"
          />
          <!--DESKTOP NAVBAR-->
          <nav
            role="navigation"
            class="hidden md:flex md:flex-2 md:justify-center"
          >
            <ul
              class="hidden md:flex items-center justify-center gap-6 text-sm font-medium"
            >
              <li
                class="hover:before:w-full before:w-0 before:h-0.5 before:-bottom-1 before:absolute before:content[''] before:bg-grey dark:before:bg-primary before:left-0 relative before:duration-300 before:ease-linear text-grey dark:text-primary"
              >
                <a href="#">Home</a>
              </li>
              <li
                class="hover:before:w-full before:w-0 before:h-0.5 before:-bottom-1 before:absolute before:content[''] before:bg-grey dark:before:bg-primary before:left-0 relative before:duration-300 before:ease-linear text-grey dark:text-primary"
              >
                <a href="#">About</a>
              </li>
              <li
                class="hover:before:w-full before:w-0 before:h-0.5 before:-bottom-1 before:absolute before:content[''] before:bg-grey dark:before:bg-primary before:left-0 relative before:duration-300 before:ease-linear text-grey dark:text-primary"
              >
                <a href="#">Projects</a>
              </li>
            </ul>
          </nav>

          <div
            class="hidden md:flex items-center gap-4 md:justify-end md:flex-1"
          >
            <div
              class="bg-[url('/images/sunny.jpg')] w-16 h-8 rounded-full relative bg-cover bg-center bg-no-repeat dark:bg-[url('/images/night.jpg')] duration-300 ease-linear cursor-pointer"
            >
              <span
                id="mode-switch-desktop"
                class="bg-indigo-500 dark:bg-yellow-500 w-8 h-8 left-0 rounded-full inline-block absolute border-2 border-transparent duration-300 ease-linear"
              ></span>
            </div>
            <a
              class="bg-grey text-primary dark:text-slate-950 text-sm font-medium py-2 px-4 rounded-full whitespace-nowrap dark:bg-emerald-500 cursor-pointer dark:hover:bg-emerald-600 hover:bg-gray-900 duration-300 ease-linear"
              href="#"
              >Start a Project</a
            >
          </div>
        </header>
        <div class="w-full flex flex-col items-center justify-center">
          <div class="w-full flex justify-center">
            <img
              class="rounded-full w-full md:w-3/4 lg:w-2/7"
              src="/images/developer_2.png"
              alt="developer"
            />
          </div>
          <div class="translate-y-5 text-center">
            <h2
              class="text-3xl md:text-5xl lg:text-5xl text-grey dark:text-primary"
            >
              Mohamed Amine Nafia
            </h2>
            <span class="mt-3 inline-block text-light-grey text-lg md:text-3xl"
              >FRONTEND DEVELOPER</span
            >
          </div>
          <div
            class="flex items-center py-1 px-2 gap-5 translate-y-8 md:gap-10 rounded-sm md:mt-3"
          >
            <span class="text-sm md:text-xl text-grey dark:text-primary"
              >FIND ME ON
            </span>
            <a href="#"
              ><img
                class="w-5 md:w-6 grayscale-100 hover:grayscale-0"
                src="/images/facebook.webp"
                alt="facebook"
            /></a>
            <a href="#"
              ><img
                class="w-5 md:w-6 grayscale-100 hover:grayscale-0"
                src="/images/github.webp"
                alt="github"
            /></a>
            <a href="#"
              ><img
                class="w-5 md:w-6 grayscale-100 hover:grayscale-0"
                src="/images/linkedin.webp"
                alt="linkedin"
            /></a>
          </div>
        </div>
        <div class="fixed bottom-3 right-5 animate-bounce">
          <a href="#"
            ><img
              class="w-28 md:w-36"
              src="/images/whatsapp.webp"
              alt="whatsapp"
          /></a>
        </div>
      </section>

      <!--MOBILE NAVBAR-->
      <nav
        role="navigation"
        id="mobile-navbar"
        class="fixed flex -translate-x-50 flex-col items-center bottom-3.5 top-3.5 left-3.5 text-sm duration-500 ease-linear bg-grey/10 backdrop-blur-2xl rounded-xl py-3.5 md:hidden dark:bg-primary/10"
      >
        <img class="w-12" src="./images/logo_2.webp" alt="logo" />
        <ul
          class="text-grey flex flex-col items-center justify-center gap-6 p-3.5 h-full dark:text-primary"
        >
          <li class="flex flex-col justify-center items-center gap-1">
            <img
              class="w-6 invert-100 dark:invert-0"
              src="./images/house.svg"
              alt="house"
            /><a href="#">Home</a>
          </li>
          <li class="flex flex-col justify-center items-center gap-1">
            <img
              class="w-6 invert-100 dark:invert-0"
              src="./images/info.svg"
              alt="info"
            /><a href="#">About</a>
          </li>
          <li class="flex flex-col items-center justify-center gap-1">
            <img
              class="w-6 invert-100 dark:invert-0"
              src="./images/folder.svg"
              alt="folder"
            /><a href="#">Projects</a>
          </li>
          <li class="flex flex-col justify-center items-center gap-1">
            <img
              class="w-6 invert-100 dark:invert-0"
              src="./images/message.svg"
              alt="message"
            /><a href="#">Contacts</a>
          </li>
        </ul>
        <div
          class="bg-[url('/images/sunny.jpg')] h-19 w-8 rounded-full relative bg-cover bg-center bg-no-repeat dark:bg-[url('/images/night.jpg')] duration-300 ease-linear"
        >
          <span
            id="mode-switch"
            class="bg-indigo-500 dark:bg-yellow-500 w-8 h-8 left-0 rounded-full inline-block absolute border-2 border-transparent duration-300 ease-linear"
          ></span>
        </div>
      </nav>
    </div>
    <script src="app.js"></script>
  </body>
</html>
